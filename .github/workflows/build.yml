name: Build GeoWell AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Build GeoWell AI v2
        shell: bash
        run: |
          flutter create --org com.geowell --project-name geowell_ai .
          cat > pubspec.yaml <<'YAML'
          name: geowell_ai
          description: GeoWell AI groundwater field assistant
          publish_to: "none"
          version: 2.0.0+2
          environment:
            sdk: ">=3.8.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_map: ^8.1.1
            latlong2: ^0.9.1
            geolocator: ^14.0.2
            shared_preferences: ^2.5.3
            http: ^1.4.0
            pdf: ^3.11.3
            printing: ^5.14.2
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^6.0.0
          flutter:
            uses-material-design: true
          YAML

          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:flutter_map/flutter_map.dart';
          import 'package:latlong2/latlong.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:http/http.dart' as http;
          import 'package:pdf/widgets.dart' as pw;
          import 'package:printing/printing.dart';

          void main(){WidgetsFlutterBinding.ensureInitialized();runApp(const App());}

          class Site{
            String id,name,notes,result,rock; double lat,lon; double? depth,water;
            DateTime date;
            Site({required this.id,required this.name,required this.lat,required this.lon,this.notes='',this.result='pending',this.rock='',this.depth,this.water,DateTime? date}):date=date??DateTime.now();
            Map<String,dynamic> toJson()=>{'id':id,'name':name,'lat':lat,'lon':lon,'notes':notes,'result':result,'rock':rock,'depth':depth,'water':water,'date':date.toIso8601String()};
            factory Site.fromJson(Map<String,dynamic> j)=>Site(id:j['id']??'',name:j['name']??'نقطة',lat:(j['lat'] as num).toDouble(),lon:(j['lon'] as num).toDouble(),notes:j['notes']??'',result:j['result']??'pending',rock:j['rock']??'',depth:(j['depth'] as num?)?.toDouble(),water:(j['water'] as num?)?.toDouble(),date:DateTime.tryParse(j['date']??'')??DateTime.now());
          }

          class Store{
            static const k='geowell_sites_v2';
            static Future<List<Site>> load()async{final p=await SharedPreferences.getInstance();final s=p.getString(k);if(s==null)return [];try{return (jsonDecode(s) as List).map((e)=>Site.fromJson(Map<String,dynamic>.from(e))).toList();}catch(_){return [];}}
            static Future<void> save(List<Site> x)async{final p=await SharedPreferences.getInstance();await p.setString(k,jsonEncode(x.map((e)=>e.toJson()).toList()));}
          }

          class Moisture{final double? soil,temp,rain;Moisture(this.soil,this.temp,this.rain);}

          class App extends StatelessWidget{
            const App({super.key});
            @override Widget build(BuildContext c)=>MaterialApp(debugShowCheckedModeBanner:false,title:'GeoWell AI',theme:ThemeData(useMaterial3:true,colorScheme:ColorScheme.fromSeed(seedColor:const Color(0xff00796b)),scaffoldBackgroundColor:const Color(0xfff4f8f7)),home:const Home());
          }

          class Home extends StatefulWidget{const Home({super.key});@override State<Home> createState()=>_HomeState();}
          class _HomeState extends State<Home>{
            List<Site> sites=[];int tab=0;bool busy=false;
            @override void initState(){super.initState();load();}
            Future<void> load()async{sites=await Store.load();if(mounted)setState((){});}
            Future<void> save()async{await Store.save(sites);if(mounted)setState((){});}
            double dist(double a,double b,double c,double d){const r=6371.0;final p1=a*math.pi/180,p2=c*math.pi/180,dp=(c-a)*math.pi/180,dl=(d-b)*math.pi/180;final h=math.sin(dp/2)*math.sin(dp/2)+math.cos(p1)*math.cos(p2)*math.sin(dl/2)*math.sin(dl/2);return 2*r*math.asin(math.sqrt(h.clamp(0,1)));}
            Future<Moisture?> moisture(double lat,double lon)async{try{final u=Uri.parse('https://api.open-meteo.com/v1/forecast?latitude=$lat&longitude=$lon&current=temperature_2m,precipitation&hourly=soil_moisture_0_to_1cm&forecast_days=1&timezone=auto');final r=await http.get(u).timeout(const Duration(seconds:10));if(r.statusCode!=200)return null;final j=jsonDecode(r.body),v=(j['hourly']['soil_moisture_0_to_1cm'] as List);return Moisture(v.isEmpty||v[0]==null?null:(v[0] as num).toDouble()*100,(j['current']['temperature_2m'] as num?)?.toDouble(),(j['current']['precipitation'] as num?)?.toDouble());}catch(_){return null;}}
            Future<void> analyzePoint(LatLng p,{Site? existing})async{
              setState(()=>busy=true);final m=await moisture(p.latitude,p.longitude);setState(()=>busy=false);
              final near=<MapEntry<Site,double>>[];for(final s in sites){final d=dist(p.latitude,p.longitude,s.lat,s.lon);if(d<=20)near.add(MapEntry(s,d));}near.sort((a,b)=>a.value.compareTo(b.value));
              double score=50,wd=0,ws=0;int useful=0;for(final e in near){final s=e.key,w=1/math.max(e.value,.1);if(s.result=='successful'){score+=math.min(8*w/2,8);if(s.depth!=null){wd+=s.depth!*w;ws+=w;}useful++;}else if(s.result=='failed'){score-=math.min(7*w/2,7);useful++;}}
              if(m?.soil!=null)score+=(m!.soil!-25)*.12;score=score.clamp(0,100);double? dmin,dmax;if(ws>0){final center=wd/ws,spread=math.max(center*.25,15);dmin=math.max(0,center-spread);dmax=center+spread;}
              final nearest=near.isEmpty?null:near.first;final sim=nearest==null?null:(100*math.exp(-nearest.value/5)).clamp(0,100);final conf=useful>=4?'متوسطة إلى جيدة':useful>=2?'متوسطة':'منخفضة';
              if(!mounted)return;showModalBottomSheet(context:context,isScrollControlled:true,showDragHandle:true,builder:(_)=>SafeArea(child:Padding(padding:const EdgeInsets.fromLTRB(18,5,18,24),child:Column(mainAxisSize:MainAxisSize.min,crossAxisAlignment:CrossAxisAlignment.stretch,children:[Text('تحليل GeoWell AI',style:Theme.of(context).textTheme.headlineSmall?.copyWith(fontWeight:FontWeight.bold)),Text('📍 ${p.latitude.toStringAsFixed(6)}, ${p.longitude.toStringAsFixed(6)}'),const SizedBox(height:12),Container(padding:const EdgeInsets.all(18),decoration:BoxDecoration(borderRadius:BorderRadius.circular(20),gradient:const LinearGradient(colors:[Color(0xff00695c),Color(0xff26a69a)])),child:Text('مؤشر ملاءمة مبدئي: ${score.toStringAsFixed(0)}%',style:const TextStyle(color:Colors.white,fontSize:23,fontWeight:FontWeight.bold))),_row('💧 رطوبة التربة',m?.soil==null?'غير متاحة':'${m!.soil!.toStringAsFixed(1)}%'),_row('📏 أقرب موقع',nearest==null?'لا يوجد':'${nearest.value.toStringAsFixed(2)} كم'),_row('📊 التشابه المكاني',sim==null?'لا يوجد':'${sim.toStringAsFixed(0)}%'),_row('⭐ الثقة',conf),_row('📐 العمق التقديري',dmin==null?'لا توجد بيانات حفر كافية':'${dmin.toStringAsFixed(0)} – ${dmax!.toStringAsFixed(0)} م'),const SizedBox(height:8),const Text('⚠️ الرطوبة السطحية مؤشر مساعد فقط وليست إثباتًا للمياه الجوفية. العمق تقدير مبني على نتائج حفر حقيقية محفوظة، وليس ضمانًا.'),const SizedBox(height:12),FilledButton.icon(onPressed:existing==null?()=>add(p):()=>edit(existing),icon:Icon(existing==null?Icons.save:Icons.edit),label:Text(existing==null?'حفظ النقطة':'تسجيل نتيجة الحفر')),OutlinedButton.icon(onPressed:()=>report(p,score,dmin,dmax,m?.soil),icon:const Icon(Icons.picture_as_pdf),label:const Text('تقرير PDF'))]))));
            }
            Widget _row(String a,String b)=>Card(child:Padding(padding:const EdgeInsets.all(12),child:Row(children:[Expanded(child:Text(a)),Text(b,style:const TextStyle(fontWeight:FontWeight.bold))])));
            Future<void> add(LatLng p)async{final n=TextEditingController(text:'نقطة ${sites.length+1}'),no=TextEditingController();final ok=await showDialog<bool>(context:context,builder:(_)=>AlertDialog(title:const Text('حفظ الموقع'),content:Column(mainAxisSize:MainAxisSize.min,children:[TextField(controller:n,decoration:const InputDecoration(labelText:'اسم الموقع')),TextField(controller:no,maxLines:3,decoration:const InputDecoration(labelText:'ملاحظات'))]),actions:[TextButton(onPressed:()=>Navigator.pop(context,false),child:const Text('إلغاء')),FilledButton(onPressed:()=>Navigator.pop(context,true),child:const Text('حفظ'))]));if(ok!=true)return;final s=Site(id:DateTime.now().microsecondsSinceEpoch.toString(),name:n.text.isEmpty?'نقطة':n.text,lat:p.latitude,lon:p.longitude,notes:no.text);sites.add(s);await save();if(mounted)Navigator.pop(context);}
            Future<void> edit(Site s)async{Navigator.pop(context);final dep=TextEditingController(text:s.depth?.toString()??''),wat=TextEditingController(text:s.water?.toString()??''),rock=TextEditingController(text:s.rock),no=TextEditingController(text:s.notes);String res=s.result;final ok=await showDialog<bool>(context:context,builder:(_)=>StatefulBuilder(builder:(c,set)=>AlertDialog(title:const Text('نتيجة الحفر'),content:SingleChildScrollView(child:Column(children:[DropdownButtonFormField<String>(value:res,decoration:const InputDecoration(labelText:'النتيجة'),items:const[DropdownMenuItem(value:'pending',child:Text('لم يتم الحفر')),DropdownMenuItem(value:'successful',child:Text('نجح الحفر')),DropdownMenuItem(value:'failed',child:Text('لم ينجح'))],onChanged:(v){if(v!=null)set(()=>res=v);}),TextField(controller:dep,keyboardType:TextInputType.number,decoration:const InputDecoration(labelText:'العمق الحقيقي بالمتر')),TextField(controller:wat,keyboardType:TextInputType.number,decoration:const InputDecoration(labelText:'كمية المياه إن عُرفت')),TextField(controller:rock,decoration:const InputDecoration(labelText:'نوع الصخور/التربة')),TextField(controller:no,maxLines:3,decoration:const InputDecoration(labelText:'ملاحظات'))])),actions:[TextButton(onPressed:()=>Navigator.pop(c,false),child:const Text('إلغاء')),FilledButton(onPressed:()=>Navigator.pop(c,true),child:const Text('حفظ'))])));if(ok!=true)return;s.result=res;s.depth=double.tryParse(dep.text.replaceAll(',','.'));s.water=double.tryParse(wat.text.replaceAll(',','.'));s.rock=rock.text;s.notes=no.text;await save();}
            Future<void> locate()async{if(!await Geolocator.isLocationServiceEnabled())return;var q=await Geolocator.checkPermission();if(q==LocationPermission.denied)q=await Geolocator.requestPermission();if(q==LocationPermission.denied||q==LocationPermission.deniedForever)return;final p=await Geolocator.getCurrentPosition();if(!mounted)return;Navigator.push(context,MaterialPageRoute(builder:(_)=>MapPage(initial:LatLng(p.latitude,p.longitude),sites:sites,onTap:analyzePoint,onAdd:add)));}
            Future<void> report(LatLng p,double score,double? dmin,double? dmax,double? moist)async{final doc=pw.Document();doc.addPage(pw.Page(build:(_)=>pw.Column(crossAxisAlignment:pw.CrossAxisAlignment.start,children:[pw.Text('GeoWell AI - Site Report'),pw.SizedBox(height:15),pw.Text('Coordinates: ${p.latitude}, ${p.longitude}'),pw.Text('Suitability index: ${score.toStringAsFixed(0)}%'),pw.Text('Soil moisture: ${moist?.toStringAsFixed(1)??'N/A'}%'),pw.Text('Estimated depth: ${dmin==null?'N/A':'${dmin.toStringAsFixed(0)}-${dmax!.toStringAsFixed(0)} m'}'),pw.SizedBox(height:15),pw.Text('Decision-support estimate only. It does not prove groundwater or guarantee drilling depth.')]));await Printing.layoutPdf(onLayout:(_)=>doc.save());}
            @override Widget build(BuildContext c){final body=tab==0?Dashboard(sites:sites,onMap:()=>setState(()=>tab=1),onLocate:locate,onEdit:edit):MapPage(initial:const LatLng(24.7136,46.6753),sites:sites,onTap:analyzePoint,onAdd:add);return Scaffold(appBar:AppBar(title:const Text('GeoWell AI')),body:body,bottomNavigationBar:NavigationBar(selectedIndex:tab,onDestinationSelected:(i)=>setState(()=>tab=i),destinations:const[NavigationDestination(icon:Icon(Icons.dashboard_outlined),label:'الرئيسية'),NavigationDestination(icon:Icon(Icons.map_outlined),label:'الخريطة')]),floatingActionButton:busy?const FloatingActionButton(onPressed:null,child:CircularProgressIndicator()):null);}
          }

          class Dashboard extends StatelessWidget{final List<Site> sites;final VoidCallback onMap,onLocate;final Future<void> Function(Site) onEdit;const Dashboard({super.key,required this.sites,required this.onMap,required this.onLocate,required this.onEdit});@override Widget build(BuildContext c){final ok=sites.where((x)=>x.result=='successful').length;final fail=sites.where((x)=>x.result=='failed').length;return ListView(padding:const EdgeInsets.all(16),children:[Container(padding:const EdgeInsets.all(22),decoration:BoxDecoration(borderRadius:BorderRadius.circular(24),gradient:const LinearGradient(colors:[Color(0xff004d40),Color(0xff00897b)])),child:const Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text('GeoWell AI',style:TextStyle(color:Colors.white70)),SizedBox(height:5),Text('مساعدك الميداني لمواقع الآبار',style:TextStyle(color:Colors.white,fontSize:24,fontWeight:FontWeight.bold)),SizedBox(height:7),Text('اختر أي نقطة من الخريطة لتحليلها.',style:TextStyle(color:Colors.white70))])),Row(children:[Expanded(child:_s('النقاط','${sites.length}')),Expanded(child:_s('ناجحة','$ok')),Expanded(child:_s('غير ناجحة','$fail'))]),FilledButton.icon(onPressed:onMap,icon:const Icon(Icons.map),label:const Text('الخريطة والتحليل')),OutlinedButton.icon(onPressed:onLocate,icon:const Icon(Icons.my_location),label:const Text('موقعي الحالي')),const SizedBox(height:10),const Text('سجل الحفر',style:TextStyle(fontSize:20,fontWeight:FontWeight.bold)),...sites.reversed.map((s)=>Card(child:ListTile(leading:Icon(s.result=='successful'?Icons.water_drop:s.result=='failed'?Icons.close:Icons.location_on),title:Text(s.name),subtitle:Text('${s.lat.toStringAsFixed(5)}, ${s.lon.toStringAsFixed(5)}${s.depth==null?'':' • ${s.depth!.toStringAsFixed(0)} م'}'),trailing:IconButton(onPressed:()=>onEdit(s),icon:const Icon(Icons.edit)))))]);}Widget _s(String a,String b)=>Expanded(child:Card(child:Padding(padding:const EdgeInsets.all(12),child:Column(children:[Text(b,style:const TextStyle(fontSize:20,fontWeight:FontWeight.bold)),Text(a,style:const TextStyle(fontSize:11))]))));}

          class MapPage extends StatefulWidget{final LatLng initial;final List<Site> sites;final Future<void> Function(LatLng) onTap,onAdd;const MapPage({super.key,required this.initial,required this.sites,required this.onTap,required this.onAdd});@override State<MapPage> createState()=>_MapState();}
          class _MapState extends State<MapPage>{late MapController mc;String layer='sat';@override void initState(){super.initState();mc=MapController();}String get url=>layer=='sat'?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}':layer=='topo'?'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}':'https://tile.openstreetmap.org/{z}/{x}/{y}.png';@override Widget build(BuildContext c)=>Stack(children:[FlutterMap(mapController:mc,options:MapOptions(initialCenter:widget.initial,initialZoom:13,onTap:(t,p)=>widget.onTap(p)),children:[TileLayer(urlTemplate:url,userAgentPackageName:'com.geowell.geowell_ai'),MarkerLayer(markers:widget.sites.map((s)=>Marker(point:LatLng(s.lat,s.lon),width:44,height:44,child:GestureDetector(onTap:()=>widget.onTap(LatLng(s.lat,s.lon)),child:Icon(s.result=='successful'?Icons.water_drop:Icons.location_on,size:38,color:s.result=='successful'?Colors.blue:Colors.red)))).toList())]),Positioned(top:10,left:10,right:10,child:Card(child:Row(children:[const Padding(padding:EdgeInsets.all(8),child:Icon(Icons.layers)),const Expanded(child:Text('طبقة الخريطة')),PopupMenuButton<String>(onSelected:(v)=>setState(()=>layer=v),itemBuilder:(_)=>const[PopupMenuItem(value:'sat',child:Text('🛰️ الأقمار الصناعية')),PopupMenuItem(value:'topo',child:Text('⛰️ التضاريس')),PopupMenuItem(value:'osm',child:Text('🗺️ الأساسية'))])])),Positioned(bottom:20,right:12,child:Column(children:[FloatingActionButton.small(heroTag:'zi',onPressed:()=>mc.move(mc.camera.center,mc.camera.zoom+1),child:const Icon(Icons.add)),const SizedBox(height:8),FloatingActionButton.small(heroTag:'zo',onPressed:()=>mc.move(mc.camera.center,mc.camera.zoom-1),child:const Icon(Icons.remove)),const SizedBox(height:8),FloatingActionButton.extended(heroTag:'add',onPressed:()=>widget.onAdd(mc.camera.center),icon:const Icon(Icons.add_location_alt),label:const Text('إضافة هنا'))]))]);}
          DART

          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          m='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          if 'ACCESS_FINE_LOCATION' not in s:s=s.replace(m,m+perms)
          open(p,'w',encoding='utf-8').write(s)
          PY
          flutter pub get
          flutter analyze
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geowell-ai-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
